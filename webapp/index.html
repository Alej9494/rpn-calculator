<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RPN Calculator</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#e6e8eb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout: one-screen instrument. A 4-line readout like the hardware's Sharp
   panel on top, the same 6 x 4 keypad filling the rest. */
:root {
  --shell: #e6e8eb;
  --key: #fbfbfc;
  --key-ink: #1d2329;
  --key-edge: #c9ced4;
  --op: #2c4866;
  --op-ink: #f3f6f9;
  --fn: #d5dae0;
  --enter: #d49a1e;
  --enter-ink: #221a08;
  --lcd: #d7ddd1;
  --lcd-ink: #1b2a1f;
  --lcd-dim: #6d7d70;
  --lcd-off: #c9cfc3;
  --warn: #a8321e;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-key: "IBM Plex Sans Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --shell: #14171b; --key: #262b31; --key-ink: #e9edf1; --key-edge: #0b0d10;
    --op: #3d6591; --op-ink: #f3f6f9; --fn: #333a42;
    --enter: #e3ad3a; --enter-ink: #1d1505;
    --lcd: #0e1612; --lcd-ink: #bfe8c9; --lcd-dim: #5b7a64; --lcd-off: #0a100d; --warn: #ff8a72;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --shell: #14171b; --key: #262b31; --key-ink: #e9edf1; --key-edge: #0b0d10;
  --op: #3d6591; --op-ink: #f3f6f9; --fn: #333a42;
  --enter: #e3ad3a; --enter-ink: #1d1505;
  --lcd: #0e1612; --lcd-ink: #bfe8c9; --lcd-dim: #5b7a64; --lcd-off: #0a100d; --warn: #ff8a72;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--shell); color: var(--key-ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
  user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
.calc {
  height: 100%; max-width: 440px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 14px;
}
.lcd {
  background: var(--lcd); color: var(--lcd-ink);
  border-radius: 10px; padding: 8px 14px 10px;
  box-shadow: inset 0 2px 6px rgb(0 0 0 / .18);
  font-family: var(--font-num); font-variant-numeric: tabular-nums;
  display: flex; flex-direction: column;
  transition: background-color .2s;
}
.lcd.off { background: var(--lcd-off); }
.lcd.off > * { visibility: hidden; }
.status {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--lcd-dim);
  min-height: 18px; padding-bottom: 4px; border-bottom: 1px solid var(--lcd-dim);
}
.status.err #status { color: var(--warn); }
.line {
  display: grid; grid-template-columns: 1.7em minmax(0, 1fr); align-items: center; gap: 6px;
  height: clamp(40px, 11vw, 48px);
}
.line .lbl { font-size: 13px; font-weight: 600; color: var(--lcd-dim); }
.line .val {
  font-size: clamp(22px, 7vw, 29px); font-weight: 600;
  text-align: right; white-space: nowrap; overflow: hidden; min-width: 0;
}
.line .val.small { font-size: clamp(16px, 5vw, 21px); }
.line.cmd { grid-template-columns: minmax(0, 1fr); }
.line.cmd .val { text-align: left; }

.keys {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 9px;
}
button {
  font-family: var(--font-key); font-weight: 600; font-size: clamp(20px, 6vw, 26px);
  border: 0; border-radius: 12px; background: var(--key); color: var(--key-ink);
  box-shadow: 0 2px 0 var(--key-edge);
  touch-action: manipulation; cursor: pointer; min-height: 44px;
  transition: transform .05s, box-shadow .05s, filter .1s;
}
button:active, button.pressed { transform: translateY(2px); box-shadow: 0 0 0 var(--key-edge); filter: brightness(.94); }
button:focus-visible { outline: 3px solid var(--enter); outline-offset: 2px; }
button.fn { background: var(--fn); font-size: clamp(14px, 4.2vw, 17px); letter-spacing: .06em; }
button.op { background: var(--op); color: var(--op-ink); font-size: clamp(24px, 7vw, 30px); }
button.enter { grid-column: span 3; background: var(--enter); color: var(--enter-ink); font-size: clamp(17px, 5vw, 20px); letter-spacing: .14em; }
button.clr { color: var(--warn); }
@media (prefers-reduced-motion: reduce) { button, .lcd { transition: none; } }
</style>
</head>
<body>

<div class="calc">
  <div class="lcd" id="lcd" aria-live="polite">
    <div class="status" id="status-row"><span id="status">0 on stack</span><span>RPN</span></div>
    <div class="line" id="line0"><span class="lbl" id="lbl0">4:</span><span class="val" id="val0"></span></div>
    <div class="line" id="line1"><span class="lbl" id="lbl1">3:</span><span class="val" id="val1"></span></div>
    <div class="line" id="line2"><span class="lbl" id="lbl2">2:</span><span class="val" id="val2"></span></div>
    <div class="line" id="line3"><span class="lbl" id="lbl3">1:</span><span class="val" id="val3"></span></div>
  </div>

  <div class="keys">
    <button class="fn clr" data-k="clear" id="k-clear" title="Tap to clear, hold 3 s to switch off">CLEAR</button>
    <button class="fn" data-k="drop" id="k-drop">DROP</button>
    <button class="fn" data-k="swap" id="k-swap">X⇄Y</button>
    <button class="op" data-k="sqrt" id="k-sqrt" aria-label="Square root">√x</button>

    <button data-k="7" id="k7">7</button>
    <button data-k="8" id="k8">8</button>
    <button data-k="9" id="k9">9</button>
    <button class="op" data-k="/" id="k-div" aria-label="Divide">÷</button>

    <button data-k="4" id="k4">4</button>
    <button data-k="5" id="k5">5</button>
    <button data-k="6" id="k6">6</button>
    <button class="op" data-k="*" id="k-mul" aria-label="Multiply">×</button>

    <button data-k="1" id="k1">1</button>
    <button data-k="2" id="k2">2</button>
    <button data-k="3" id="k3">3</button>
    <button class="op" data-k="-" id="k-sub" aria-label="Subtract">−</button>

    <button data-k="0" id="k0">0</button>
    <button data-k="." id="k-dot" aria-label="Decimal point">.</button>
    <button class="fn" data-k="neg" id="k-neg" aria-label="Change sign">+/−</button>
    <button class="op" data-k="+" id="k-add" aria-label="Add">+</button>

    <button class="enter" data-k="enter" id="k-enter">ENTER</button>
    <button class="fn" data-k="back" id="k-back" aria-label="Backspace">⌫</button>
  </div>
</div>

<script id="bcd">
// ---------------------------------------------------------------------------
// 12-digit decimal (BCD) maths, the same rules as the hardware's bcd.cpp:
// value = (-1)^neg * m * 10^q, m a 12-digit integer (or 0). Every result is
// the exact answer rounded half-up to 12 significant digits. Exponent above 99
// is an overflow error; results below 1E-99 become 0.
// ---------------------------------------------------------------------------
const BCD = (() => {
  const DIG = 12, EMAX = 99, EMIN = -99;
  const P11 = 10n ** 11n, P12 = 10n ** 12n;
  const ZERO = Object.freeze({ neg: false, m: 0n, q: 0 });
  const pow10 = k => 10n ** BigInt(k);

  function pack(neg, big, q) {
    if (big === 0n) return { ok: true, v: ZERO };
    const s = big.toString();
    let m;
    if (s.length > DIG) {
      const drop = s.length - DIG;
      m = BigInt(s.slice(0, DIG));
      q += drop;
      if (s.charCodeAt(DIG) - 48 >= 5) {          // round half up
        m += 1n;
        if (m === P12) { m = P11; q += 1; }
      }
    } else {
      m = big * pow10(DIG - s.length);
      q -= DIG - s.length;
    }
    const e = q + DIG - 1;
    if (e > EMAX) return { ok: false, err: "OVF" };
    if (e < EMIN) return { ok: true, v: ZERO };
    return { ok: true, v: { neg, m, q } };
  }

  const isZero = x => x.m === 0n;
  const negate = x => (isZero(x) ? x : { neg: !x.neg, m: x.m, q: x.q });

  function addSigned(a, b, bNeg) {
    if (isZero(b)) return { ok: true, v: a };
    if (isZero(a)) return { ok: true, v: { neg: bNeg, m: b.m, q: b.q } };
    let x = a, y = b, xNeg = a.neg, yNeg = bNeg;
    if (b.q > a.q) { x = b; y = a; xNeg = bNeg; yNeg = a.neg; }
    const diff = x.q - y.q;
    if (diff > 40) return { ok: true, v: { neg: xNeg, m: x.m, q: x.q } };
    const X = x.m * pow10(diff), Y = y.m;
    if (xNeg === yNeg) return pack(xNeg, X + Y, y.q);
    if (X === Y) return { ok: true, v: ZERO };
    return X > Y ? pack(xNeg, X - Y, y.q) : pack(yNeg, Y - X, y.q);
  }

  const add = (a, b) => addSigned(a, b, b.neg);
  const sub = (a, b) => addSigned(a, b, !b.neg);
  const mul = (a, b) => (isZero(a) || isZero(b)) ? { ok: true, v: ZERO } : pack(a.neg !== b.neg, a.m * b.m, a.q + b.q);
  function div(a, b) {
    if (isZero(b)) return { ok: false, err: "DIV0" };
    if (isZero(a)) return { ok: true, v: ZERO };
    return pack(a.neg !== b.neg, (a.m * pow10(13)) / b.m, a.q - b.q - 13);
  }

  function isqrt(n) {                              // floor(sqrt(n)) for BigInt n >= 0
    if (n < 2n) return n;
    let x = BigInt(Math.floor(Math.sqrt(Number(n))));
    for (;;) {
      const y = (x + n / x) >> 1n;
      if (y >= x) break;
      x = y;
    }
    while (x * x > n) x -= 1n;
    while ((x + 1n) * (x + 1n) <= n) x += 1n;
    return x;
  }

  function sqrt(a) {
    if (isZero(a)) return { ok: true, v: ZERO };
    if (a.neg) return { ok: false, err: "NEGSQRT" };
    let A = a.m, q = a.q;
    if (q & 1) { A *= 10n; q -= 1; }
    A *= pow10(14); q -= 14;
    return pack(false, isqrt(A), q / 2);
  }

  // Read "-12.5", "007", ".5", "1.5E-7".
  function parse(str) {
    const mt = /^([+-]?)(\d*)(?:\.(\d*))?(?:[eE]([+-]?\d+))?$/.exec(str);
    if (!mt || (mt[2] + (mt[3] || "")).length === 0) return { ok: false, err: "BAD" };
    const intDigits = mt[2], frac = mt[3] || "";
    const big = BigInt((intDigits + frac).replace(/^0+/, "") || "0");
    const exp = mt[4] ? parseInt(mt[4], 10) : 0;
    return pack(mt[1] === "-", big, exp - frac.length);
  }

  function sig(x) {                                // significant digits, trailing zeros removed
    return x.m.toString().replace(/0+$/, "") || "0";
  }
  const exponent = x => (isZero(x) ? 0 : x.q + DIG - 1);

  function toSci(x) {
    if (isZero(x)) return "0";
    const d = sig(x);
    return (x.neg ? "-" : "") + d[0] + (d.length > 1 ? "." + d.slice(1) : "") + "E" + exponent(x);
  }

  // Display text, same rules as the hardware: 12 significant digits, trailing
  // zeros removed, thousands grouped, scientific when it won't fit.
  function format(x) {
    if (isZero(x)) return "0";
    const d = sig(x), e = exponent(x), sign = x.neg ? "-" : "";
    if (e >= 0 && e < DIG) {
      const intPart = (d + "0".repeat(DIG)).slice(0, e + 1);
      const frac = d.slice(e + 1);
      return sign + intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + (frac ? "." + frac : "");
    }
    if (e < 0 && (-e - 1 + d.length) <= DIG) return sign + "0." + "0".repeat(-e - 1) + d;
    return sign + d[0] + (d.length > 1 ? "." + d.slice(1) : "") + "E" + e;
  }

  return { ZERO, isZero, negate, add, sub, mul, div, sqrt, parse, toSci, format };
})();
if (typeof module !== "undefined") module.exports = BCD;
</script>

<script>
(() => {
  const STACK_MAX = 1000, MAX_DIGITS = 12;
  const CLEAR_OFF_MS = 3000, AUTO_OFF_MS = 5 * 60 * 1000;

  let stack = [];          // BCD values; the last item is level 1
  let entry = null;        // the command line as typed; null when not typing
  let error = null;        // message shown until the next key
  let off = false;
  let autoOffTimer, clearTimer = null, clearHeldOff = false;
  let undoStack = null;    // the stack before the last key that changed it (for BACK)

  try {
    const saved = JSON.parse(localStorage.getItem("rpn-stack-bcd") || "null");
    if (saved && Array.isArray(saved.stack)) {
      for (const s of saved.stack) {
        const r = BCD.parse(String(s));
        if (r.ok) stack.push(r.v);
      }
    }
  } catch (e) {}
  const save = () => {
    try { localStorage.setItem("rpn-stack-bcd", JSON.stringify({ stack: stack.map(BCD.toSci) })); } catch (e) {}
  };

  const MESSAGES = { OVF: "Overflow", DIV0: "Error: divide by 0", NEGSQRT: "Error: sqrt of negative", BAD: "Error: bad number" };
  // True if the stack has at least n levels; otherwise the HP 48 error.
  function needArgs(n) {
    if (stack.length >= n) return true;
    error = "Error: too few arguments";
    return false;
  }

  // Push the command line onto the stack. Returns false if that failed.
  function commit() {
    if (entry === null) return true;
    const text = entry;
    entry = null;
    if (!/\d/.test(text)) return true;               // "-" or "." alone: discard
    const r = BCD.parse(text);
    if (!r.ok) { error = MESSAGES[r.err]; return false; }
    if (stack.length >= STACK_MAX) { error = "Stack full"; return false; }
    stack.push(r.v);
    return true;
  }

  function digitCount(s) {
    let n = (s.match(/\d/g) || []).length;
    if (/^-?0\./.test(s)) n -= 1;                    // a leading "0." isn't significant
    return n;
  }

  function binary(op) {
    if (!commit()) return;
    if (!needArgs(2)) return;
    const r = op(stack[stack.length - 2], stack[stack.length - 1]);
    if (!r.ok) { error = MESSAGES[r.err]; return; }  // stack untouched on error
    stack.splice(stack.length - 2, 2, r.v);
  }

  function press(k) {
    if (/^\d$/.test(k)) {
      if (entry === null) entry = "";
      if (digitCount(entry) >= MAX_DIGITS) return;   // 13th digit ignored
      const body = entry.startsWith("-") ? entry.slice(1) : entry;
      entry = body === "0" ? entry.slice(0, -1) + k : entry + k;   // "007" -> "7"
    } else if (k === ".") {
      if (entry === null) entry = "";
      if (!entry.includes(".")) {
        const body = entry.startsWith("-") ? entry.slice(1) : entry;
        entry += body === "" ? "0." : ".";
      }
    } else if (k === "enter") {
      if (entry !== null) commit();                  // push the typed number once
      else if (needArgs(1)) {
        if (stack.length >= STACK_MAX) error = "Stack full";
        else stack.push(stack[stack.length - 1]);    // nothing typed: duplicate level 1
      }
    } else if (k === "neg") {
      if (entry !== null) entry = entry.startsWith("-") ? entry.slice(1) : "-" + entry;
      else if (needArgs(1)) stack[stack.length - 1] = BCD.negate(stack[stack.length - 1]);
    } else if (k === "back") {
      if (entry !== null) {
        entry = entry.slice(0, -1);
        if (entry === "" || entry === "-") entry = null;
      }                                              // not typing: undo (see handleKey)
    } else if (k === "drop") {
      if (entry !== null) entry = null;              // cancel the command line
      else if (needArgs(1)) stack.pop();
    } else if (k === "swap") {
      if (!commit()) return;
      if (!needArgs(2)) return;
      const m = stack.length;
      [stack[m - 1], stack[m - 2]] = [stack[m - 2], stack[m - 1]];
    } else if (k === "+") binary(BCD.add);
    else if (k === "-") binary(BCD.sub);
    else if (k === "*") binary(BCD.mul);
    else if (k === "/") binary(BCD.div);
    else if (k === "sqrt") {
      if (!commit()) return;
      if (!needArgs(1)) return;
      const r = BCD.sqrt(stack[stack.length - 1]);
      if (!r.ok) { error = MESSAGES[r.err]; return; }
      stack[stack.length - 1] = r.v;
    } else if (k === "clear") {
      stack = []; entry = null;
    }
  }

  // Undo: before a key runs, the stack is copied. If the key changed the
  // stack, that copy becomes the undo stack. BACK with nothing typed swaps the
  // two, so pressing it again redoes. One level, as on the HP 48.
  const sameNumber = (a, b) => a.neg === b.neg && a.m === b.m && a.q === b.q;
  const sameStack = (a, b) => a.length === b.length && a.every((v, i) => sameNumber(v, b[i]));

  // Every key goes through here: wake, clear an error, undo, or act.
  function handleKey(k) {
    resetAutoOff();
    if (off) { off = false; render(); return; }      // any key wakes; that press does nothing else
    if (error) { error = null; render(); return; }   // next key only clears the message
    if (k === "back" && entry === null) {            // BACK with nothing typed: undo
      if (undoStack) [stack, undoStack] = [undoStack, stack];
    } else {
      const before = stack.slice();
      press(k);
      if (!sameStack(before, stack)) undoStack = before;
    }
    render();
    save();
  }

  function switchOff() {
    off = true;
    render();
  }

  function resetAutoOff() {
    clearTimeout(autoOffTimer);
    autoOffTimer = setTimeout(switchOff, AUTO_OFF_MS);
  }

  const shown = s => s.replace(/-/g, "−");      // true minus sign, as on the hardware

  function render() {
    document.getElementById("lcd").classList.toggle("off", off);
    const statusRow = document.getElementById("status-row");
    statusRow.classList.toggle("err", !!error);
    document.getElementById("status").textContent = error || `${stack.length} on stack`;

    // Not typing: levels 4, 3, 2, 1. Typing: levels 3, 2, 1, then the command line.
    const typing = entry !== null;
    const top = typing ? 3 : 4;
    for (let line = 0; line < 4; line++) {
      const row = document.getElementById("line" + line);
      const lbl = document.getElementById("lbl" + line);
      const val = document.getElementById("val" + line);
      const isCmd = typing && line === 3;
      row.classList.toggle("cmd", isCmd);
      lbl.hidden = isCmd;
      let text = "";
      if (isCmd) {
        text = shown(entry);
      } else {
        const level = top - line;
        lbl.textContent = level + ":";
        if (stack.length >= level) text = shown(BCD.format(stack[stack.length - level]));
      }
      val.textContent = text;
      val.classList.toggle("small", text.length > 14);   // long numbers drop a size, as on the panel
    }
  }

  // CLEAR acts on release; held for 3 s it switches off (stack kept).
  const clearKey = document.getElementById("k-clear");
  clearKey.addEventListener("pointerdown", e => {
    clearHeldOff = false;
    clearTimer = setTimeout(() => {
      clearTimer = null;
      if (!off && !error) { clearHeldOff = true; switchOff(); }
    }, CLEAR_OFF_MS);
  });
  const endClear = () => { if (clearTimer) { clearTimeout(clearTimer); clearTimer = null; } };
  clearKey.addEventListener("pointerup", endClear);
  clearKey.addEventListener("pointercancel", endClear);
  clearKey.addEventListener("pointerleave", endClear);
  clearKey.addEventListener("contextmenu", e => e.preventDefault());

  document.querySelector(".keys").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.k === "clear" && clearHeldOff) { clearHeldOff = false; return; }   // release after switch-off
    try { navigator.vibrate && navigator.vibrate(6); } catch (err) {}
    handleKey(b.dataset.k);
  });

  const keymap = { Enter: "enter", "=": "enter", Backspace: "back", "+": "+", "-": "-", "*": "*", "x": "*",
    "/": "/", ".": ".", ",": ".", n: "neg", r: "sqrt", s: "swap", d: "drop", Delete: "drop", Escape: "clear" };
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
    const k = /^\d$/.test(e.key) ? e.key : keymap[e.key];
    if (!k) return;
    e.preventDefault();
    const b = document.querySelector(`[data-k="${CSS.escape(k)}"]`);
    if (b) { b.classList.add("pressed"); setTimeout(() => b.classList.remove("pressed"), 90); }
    handleKey(k);
  });

  resetAutoOff();
  render();
})();
</script>

</body></html>
