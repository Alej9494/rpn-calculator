# Publishes webapp/ to GitHub Pages: https://alej9494.github.io/rpn-calculator/
# Runs on every push to main that touches webapp/, or by hand from the Actions tab.
name: Publish web app

on:
  push:
    branches: [main]
    paths: ["webapp/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the offline cache with this commit
        run: sed -i "s/const VERSION = \"dev\";/const VERSION = \"${GITHUB_SHA::7}\";/" webapp/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
      - id: deployment
        uses: actions/deploy-pages@v4
